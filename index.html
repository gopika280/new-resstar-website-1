<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESSTAR-TASK</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Dancing+Script:wght@400..700&family=Emilys+Candy&family=Great+Vibes&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">


</head>

<body>



    <div class="container">

        <div class="header-section_one">
            <h1 class="header-section-one_heading">Reestar</h1>
            <h5 class="header-section-one_description"> Home | Recipe | Contact</h5>
        </div>




        <div class="container_body">

            <div class="section-one">
                <img src="burger.png" class="section-one_image">
                <h6 class="section-one_name">Burger</h6>
                <p class="section-one_description"></p>

                <button class="section-one_button">Order now</button>
            </div>

            <div class="section-two">
                <img src="pancake.png" class="section-two_image">
                <h6 class="section-two_name">Pancake</h6>
                <p class="section-two_description"></p>
                <button class="section-two_button">Order now</button>
            </div>

            <div class="section-three">
                <img src="falooda.png" class="section-three_image">
                <h6 class="section-three_name">Falooda</h6>
                <p class="section-three_description"></p>
                <button class="section-three_button">Order now</button>
            </div>

            <div class="section-four">
                <img src="tiramisu.png" class="section-four_image">
                <h6 class="section-four_name">Tiramisu</h6>
                <p class="section-four_description"></p>
                <button class="section-four_button">Order now</button>
            </div>

        </div>

        <div class="contact-form">
            <h1> Contact Us</h1>
            <form>
                <table>
                    <tr>
                        <td>Name </td>
                        <td><input type="text" placeholder="Enter your name" class="contact-form_input"></td>
                    </tr>


                    <tr>
                        <td>Age </td>
                        <td><input type="number" placeholder="Enter your age" class="contact-form_input"></td>

                    </tr>

                    <tr>
                        <td>Email </td>
                        <td><input type="email" placeholder="Enter your email" class="contact-form_input"></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td><input type="submit" class="contact-form_submit"></td>
                    </tr>

                </table>
            </form>

        </div>





    </div>

</body>

</html>
